<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKA Wallet - Menú Principal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
</head>
<body>
  <div class="container">
    <div class="text-center mb-3">
      <img src="logo.svg" alt="AKA Wallet Logo" width="80">
    </div>
    <h2>Menú Principal</h2>
    <div id="alert-container"></div>
    <div class="balance-label">Saldo en cuenta:</div>
    <div class="balance-display" id="saldoDisplay">$60,000</div>
    <div class="nav-buttons">
      <button type="button" id="depositBtn" class="btn btn-primary">Depositar</button>
      <button type="button" id="sendMoneyBtn" class="btn btn-primary">Enviar Dinero</button>
      <button type="button" id="transactionsBtn" class="btn btn-primary">Últimos Movimientos</button>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    $(document).ready(function() {
      var saldo = localStorage.getItem('saldo');
      if (saldo) {
        var saldoFormateado = '$' + parseInt(saldo);
        $('#saldoDisplay').text(saldoFormateado);
      }

      $('#depositBtn').click(function() {
        var mensaje = '<div class="alert alert-info">Redirigiendo a Depositar...</div>';
        $('#alert-container').html(mensaje);
        setTimeout(function() {
          window.location.href = 'deposit.html';
        }, 1000);
      });

      $('#sendMoneyBtn').click(function() {
        var mensaje = '<div class="alert alert-info">Redirigiendo a Enviar Dinero...</div>';
        $('#alert-container').html(mensaje);
        setTimeout(function() {
          window.location.href = 'sendmoney.html';
        }, 1000);
      });

      $('#transactionsBtn').click(function() {
        var mensaje = '<div class="alert alert-info">Redirigiendo a Últimos Movimientos...</div>';
        $('#alert-container').html(mensaje);
        setTimeout(function() {
          window.location.href = 'transactions.html';
        }, 1000);
      });
    });
  </script>
</body>
</html>
