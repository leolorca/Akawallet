<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKA Wallet - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
</head>
<body>
  <div class="container">
    <div class="text-center mb-3">
      <img src="logo.svg" alt="AKA Wallet Logo" width="80">
    </div>
    <h2>Login</h2>
    <div id="alert-container"></div>
    <form id="loginForm">
      <div class="form-group mb-3">
        <label for="email">Email:</label>
        <input type="email" class="form-control" id="email" placeholder="Ingrese su email">
      </div>
      <div class="form-group mb-3">
        <label for="password">Contraseña:</label>
        <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña">
      </div>
      <div class="nav-buttons">
        <button type="submit" id="loginBtn" class="btn btn-primary">Login</button>
      </div>
      <label class="mt-2 text-muted"> Usar: user@example.com / 123456</label>
    </form>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  <script>
    $(document).ready(function() {
        $('#loginForm').submit(function(event) {
          event.preventDefault();

          var email = $('#email').val();
          var password = $('#password').val();
          var usuarioValido = 'user@example.com';
          var contrasenaValida = '123456';

          $('#alert-container').html('');

          if (email === usuarioValido && password === contrasenaValida) {
            
            if (!localStorage.getItem('saldo')) {
                localStorage.setItem('saldo', 60000);
            }
            
            var alerta = '<div class="alert alert-success" role="alert">¡Login exitoso! Redirigiendo...</div>';
            $('#alert-container').append(alerta);
            
            setTimeout(function() {
                window.location.href = 'menu.html';
            }, 1500);
          } else {
            var alerta = '<div class="alert alert-danger" role="alert">Email o contraseña incorrectos</div>';
            $('#alert-container').append(alerta);
          }
        });
    });
  </script>
</body>
</html>
