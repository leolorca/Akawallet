<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKA Wallet - Enviar Dinero</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
</head>
<body>
  <div class="container">
    <div class="text-center mb-3">
      <img src="logo.svg" alt="AKA Wallet Logo" width="80">
    </div>
    <h2>Enviar Dinero</h2>
    <div id="alert-container"></div>
    
    <div class="form-group mb-3">
      <label for="searchContact">Buscar en la agenda de transferencias:</label>
      <input type="text" class="form-control" id="searchContact" placeholder="Buscar por nombre o alias">
    </div>
    
    <button type="button" id="addContactBtn" class="btn btn-primary mb-3">Agregar nuevo contacto</button>
    
    <div id="formNuevoContacto" style="display: none;" class="mb-4 p-3 border">
      <h4>Nuevo Contacto</h4>
      <form id="nuevoContactoForm">
        <div class="form-group mb-2">
          <label for="nombreContacto">Nombre y Apellido:</label>
          <input type="text" class="form-control" id="nombreContacto" required>
        </div>
        <div class="form-group mb-2">
          <label for="cbuContacto">Número de CBU:</label>
          <input type="text" class="form-control" id="cbuContacto" required>
        </div>
        <div class="form-group mb-2">
          <label for="aliasContacto">Alias:</label>
          <input type="text" class="form-control" id="aliasContacto" required>
        </div>
        <div class="form-group mb-2">
          <label for="bancoContacto">Nombre del Banco:</label>
          <input type="text" class="form-control" id="bancoContacto" required>
        </div>
        <button type="submit" class="btn btn-primary">Guardar Contacto</button>
        <button type="button" id="cancelarBtn" class="btn btn-secondary">Cancelar</button>
      </form>
    </div>

    <h3>Mis Contactos</h3>
    <ul id="contactList" class="list-group mb-3">
    </ul>
    
    <div class="nav-buttons">
      <button type="button" id="enviarDineroBtn" class="btn btn-primary" style="display: none;">Enviar dinero</button>
      <a href="menu.html" class="btn btn-secondary">Volver al Menú Principal</a>
    </div>
    
    <div id="mensajeConfirmacion" style="display: none;" class="mt-3"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    $(document).ready(function() {
      var contactoSeleccionado = null;
      var contactos = [
        { nombre: 'John Doe', cbu: '123456789', alias: 'john.doe', banco: 'ABC Bank' },
        { nombre: 'Jane Smith', cbu: '987654321', alias: 'jane.smith', banco: 'XYZ Bank' }
      ];

      function mostrarContactos(filtro) {
        $('#contactList').html('');
        
        for (var i = 0; i < contactos.length; i++) {
          var contacto = contactos[i];
          var nombreLower = contacto.nombre.toLowerCase();
          var aliasLower = contacto.alias.toLowerCase();
          var filtroLower = filtro.toLowerCase();
          
          var mostrar = false;
          if (filtro === '') {
            mostrar = true;
          } else {
            if (nombreLower.indexOf(filtroLower) >= 0 || aliasLower.indexOf(filtroLower) >= 0) {
              mostrar = true;
            }
          }
          
          if (mostrar) {
            var html = '<li class="list-group-item contacto-item" style="cursor: pointer;" data-index="' + i + '">';
            html = html + '<div class="contact-info">';
            html = html + '<span class="contact-name">' + contacto.nombre + '</span>';
            html = html + '<span class="contact-details">CBU: ' + contacto.cbu + '</span>';
            html = html + '<span class="contact-details">Alias: ' + contacto.alias + '</span>';
            html = html + '<span class="contact-details">Banco: ' + contacto.banco + '</span>';
            html = html + '</div></li>';
            
            $('#contactList').append(html);
          }
        }
        
        $('.contacto-item').click(function() {
          $('.contacto-item').css('background-color', '');
          $(this).css('background-color', '#fff8f0');
          
          var indice = parseInt($(this).attr('data-index'));
          contactoSeleccionado = contactos[indice];
          $('#enviarDineroBtn').show();
        });
      }

      mostrarContactos('');

      $('#searchContact').keyup(function() {
        var filtro = $('#searchContact').val();
        mostrarContactos(filtro);
      });

      $('#addContactBtn').click(function() {
        $('#formNuevoContacto').show();
      });

      $('#cancelarBtn').click(function() {
        $('#formNuevoContacto').hide();
        $('#nuevoContactoForm')[0].reset();
      });

      $('#nuevoContactoForm').submit(function(e) {
        e.preventDefault();
        
        var nombre = $('#nombreContacto').val();
        var cbu = $('#cbuContacto').val();
        var alias = $('#aliasContacto').val();
        var banco = $('#bancoContacto').val();

        if (nombre === '' || cbu === '' || alias === '' || banco === '') {
          var alerta = '<div class="alert alert-danger">Complete todos los campos</div>';
          $('#alert-container').html(alerta);
        } else {
          var nuevoContacto = { nombre: nombre, cbu: cbu, alias: alias, banco: banco };
          contactos.push(nuevoContacto);
          
          mostrarContactos('');
          $('#formNuevoContacto').hide();
          $('#nuevoContactoForm')[0].reset();
          
          var alerta = '<div class="alert alert-success">Contacto agregado exitosamente</div>';
          $('#alert-container').html(alerta);
        }
      });

      $('#enviarDineroBtn').click(function() {
        if (contactoSeleccionado === null) {
          var alerta = '<div class="alert alert-warning">Seleccione un contacto primero</div>';
          $('#alert-container').html(alerta);
        } else {
          var monto = prompt('¿Cuánto desea enviar a ' + contactoSeleccionado.nombre + '?', '0');
          
          if (monto !== null && monto !== '') {
            var montoNumero = parseInt(monto);
            var saldo = parseInt(localStorage.getItem('saldo'));
            
            if (montoNumero < 1) {
              var alerta = '<div class="alert alert-danger">Ingrese un monto válido</div>';
              $('#alert-container').html(alerta);
            } else if (montoNumero > saldo) {
              var alerta = '<div class="alert alert-danger">Saldo insuficiente</div>';
              $('#alert-container').html(alerta);
            } else {
              var nuevoSaldo = saldo - montoNumero;
              localStorage.setItem('saldo', nuevoSaldo);

              var transacciones = localStorage.getItem('transacciones');
              if (transacciones) {
                transacciones = JSON.parse(transacciones);
              } else {
                transacciones = [];
              }
              transacciones.push({ tipo: 'transferencia', descripcion: 'Envío a ' + contactoSeleccionado.nombre, monto: -montoNumero });
              localStorage.setItem('transacciones', JSON.stringify(transacciones));

              var mensaje = '<div class="alert alert-success">¡Transferencia exitosa! Se enviaron $' + montoNumero + ' a ' + contactoSeleccionado.nombre + '. Nuevo saldo: $' + nuevoSaldo + '</div>';
              $('#mensajeConfirmacion').html(mensaje);
              $('#mensajeConfirmacion').show();

              setTimeout(function() {
                window.location.href = 'menu.html';
              }, 2000);
            }
          }
        }
      });
    });
  </script>
</body>
</html>
